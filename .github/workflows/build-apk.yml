name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- 'project.zip'
- '.github/workflows/build-apk.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Java
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'

- name: Extract Android project
run: |
unzip -q project.zip -d extracted

- name: Build debug APK
shell: bash
run: |
set -e
GRADLEW= GRADLEW" ]; then
echo "Gradle wrapper not found"
exit 1
fi

PROJECT_DIR=" GRADLEW")"
cd "$`PROJECT_DIR"
chmod +x gradlew
./gradlew assembleDebug

mkdir -p "$GITHUB_WORKSPACE/apk-output" find . -type f \ -path '*/build/outputs/apk/debug/*.apk' \ -exec cp {} "$GITHUB_WORKSPACE/apk-output/" ;

test -n "`$(find "$GITHUB_WORKSPACE/apk-output" 
 -type f -name '*.apk' -print -quit)"

- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: Android-Debug-APK
path: apk-output/*.apk
if-no-files-found: error
